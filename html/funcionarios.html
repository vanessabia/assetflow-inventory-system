<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Módulo Funcionários</title>
    <link rel="stylesheet" href="../css/funcionarios.css">
</head>
<body>


    <h2>Cadastro de Funcionário</h2>


    <form id="form-funcionario">
        <input type="text" id="nome-funcionario" placeholder="Nome" required>
        <input type="text" id="setor" placeholder="Setor" required>


        <select id="equipamento" required>
            <option value="">Selecione um equipamento</option>
        </select>


        <button type="submit">Atribuir Equipamento</button>
    </form>


    <h2>Funcionários Cadastrados</h2>


    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Setor</th>
                <th>Equipamento</th>
            </tr>
        </thead>
        <tbody id="lista-funcionarios"></tbody>
    </table>


    <script src="../js/funcionarios.js"></script>
</body>
</html>
