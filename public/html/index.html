<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="apple-touch-icon" sizes="180x180" href="../img/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../img/favicon-16x16.png">

  <title>AssetFlow</title>

  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="logo">
        <img src="../img/logo.png" alt="AssetFlow">
      </div>

      <nav class="menu">
        <button onclick="abrirPagina('../html/dashboard.html')">
          📊 Dashboard
        </button>

        <button onclick="abrirPagina('../html/equipamentos.html')">
          📦 Equipamentos
        </button>

        <button onclick="abrirPagina('../html/funcionarios.html')">
          👤 Funcionários
        </button>
      </nav>

    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="main">

      <!-- TOPBAR -->
      <header class="topbar">
        <h1 id="page-title">Dashboard</h1>
      </header>

      <!-- CONTEÚDO DINÂMICO -->
      <section id="content">

        <iframe id="frame-conteudo" src="dashboard.html" frameborder="0">
        </iframe>

      </section>

    </main>

  </div>

  <script>
    function abrirPagina(pagina) {

      document.getElementById("frame-conteudo").src = pagina;

      const titulo = {
        "../html/dashboard.html": "Visão Geral",
        "../html/equipamentos.html": "Inventário de Ativos",
        "../html/funcionarios.html": "Responsáveis pelos Ativos"
      };

      document.getElementById("page-title").innerText = titulo[pagina];

    }
  </script>

  <script src="../js/dashboard.js"></script>

</body>

</body>

</html>
