<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>AssetFlow • Funcionários</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="page">

        <div class="page-top">
            <header class="page-header">
                <div class="module-card">
                    <div class="module-info">
                        <h1>Funcionários</h1>
                        <p>Gerencie os responsáveis pelos ativos e acompanhe as atribuições.</p>

                        <div class="badge-count" id="badge-count-funcionarios">
                            0 funcionários cadastrados
                        </div>
                    </div>
                </div>
            </header>

            <div class="search-section">
                <div class="search-box">
                    <span class="search-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                            <circle cx="11" cy="11" r="7" stroke="#999" stroke-width="2" />
                            <line x1="16.65" y1="16.65" x2="21" y2="21" stroke="#999" stroke-width="2" />
                        </svg>
                    </span>
                    <input type="text" id="search-input-funcionario" placeholder="Buscar por nome ou ID...">
                </div>

                <select id="filter-setor" class="search-select">
                    <option value="">Todos os setores</option>
                    <option value="TI">TI</option>
                    <option value="RH">RH</option>
                    <option value="Financeiro">Financeiro</option>
                    <option value="Administrativo">Administrativo</option>
                </select>
            </div>
        </div>

        <div class="grid">
            <!-- CARD FORM -->
            <div class="card">
                <h2>Cadastrar Funcionário</h2>

                <form id="form-funcionario">
                    <input type="hidden" id="edit-id">

                    <div class="form-group">
                        <label>Nome</label>
                        <input type="text" id="nome-funcionario" placeholder="Nome do funcionário" required>
                    </div>

                    <div class="form-group">
                        <label>Setor</label>
                        <select id="setor" required>
                            <option value="">Selecione o setor</option>
                            <option value="TI">TI</option>
                            <option value="RH">RH</option>
                            <option value="Financeiro">Financeiro</option>
                            <option value="Administrativo">Administrativo</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Equipamento</label>
                        <select id="equipamento" required>
                            <option value="">Selecione um equipamento</option>
                        </select>
                    </div>

                    <button class="btn-primary" type="submit">Salvar</button>
                </form>
            </div>

            <!-- CARD TABELA -->
            <div class="card">
                <h2>Funcionários Cadastrados</h2>

                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Setor</th>
                            <th>Equipamento</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-funcionarios"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../js/funcionarios.js"></script>
</body>
</html>
